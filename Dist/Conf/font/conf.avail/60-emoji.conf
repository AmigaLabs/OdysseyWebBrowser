<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Emoji font configuration for Odyssey Web Browser on AmigaOS4.

  SETUP:
    1. Download a color emoji font and place it in Fonts:TrueType/
       Recommended (free, permissive license):
         - Noto Color Emoji:  https://github.com/googlefonts/noto-emoji/releases
                              (download NotoColorEmoji.ttf)
         - Twemoji Mozilla:   https://github.com/mozilla/twemoji-colr/releases
                              (download TwemojiMozilla.ttf)

    2. Enable this file by symlinking or copying it to conf.d/:
         copy PROGDIR:Conf/font/conf.avail/60-emoji.conf PROGDIR:Conf/font/conf.d/60-emoji.conf

-->
<fontconfig>

  <!-- Map the CSS generic 'emoji' family to the installed font(s). -->
  <alias binding="strong">
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
      <family>Twemoji Mozilla</family>
      <family>Twemoji</family>
      <family>EmojiOne Color</family>
    </prefer>
  </alias>

  <!--
    Append the emoji font as a last-resort fallback to the three generic
    CSS families. This is what allows emoji in normal text to fall back
    to the emoji font when the primary font lacks those glyphs.
  -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="append_last">
      <string>Noto Color Emoji</string>
      <string>Twemoji Mozilla</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="append_last">
      <string>Noto Color Emoji</string>
      <string>Twemoji Mozilla</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="append_last">
      <string>Noto Color Emoji</string>
      <string>Twemoji Mozilla</string>
    </edit>
  </match>

</fontconfig>
